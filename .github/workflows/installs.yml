name: Installationszahlen

# Zieht einmal im Monat die Installationszahlen der empfohlenen Skills von skills.sh nach und öffnet dafür einen Pull Request.
# Voraussetzungen (einmalig, siehe docs/skills-installationszahlen.md): Secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (die API von skills.sh nimmt nur Vercel-OIDC-Token an) und in den Repository-Einstellungen unter „Actions“ die Erlaubnis,
# Pull Requests zu erstellen. Fehlen die Secrets, endet der Lauf ohne Fehler.
on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  installs:
    name: Zahlen nachziehen
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Zugang prüfen
        id: access
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel-Secrets fehlen, es wird nichts nachgezogen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.access.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.access.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: OIDC-Token von Vercel holen
        if: steps.access.outputs.ready == 'true'
        run: |
          npx --yes vercel@latest env pull .vercel.env --environment=development --yes --token "$VERCEL_TOKEN"
          token=$(grep '^VERCEL_OIDC_TOKEN=' .vercel.env | cut -d= -f2- | tr -d '"')
          test -n "$token" || { echo "::error::Kein VERCEL_OIDC_TOKEN erhalten (OIDC im Vercel-Projekt aktivieren)."; exit 1; }
          echo "::add-mask::$token"
          echo "SKILLS_SH_TOKEN=$token" >> "$GITHUB_ENV"
          rm .vercel.env
      - name: Zahlen abfragen
        if: steps.access.outputs.ready == 'true'
        run: |
          pip install httpx
          python .github/scripts/update_installs.py copilot/app/skill_catalog/catalog.json | tee /tmp/installs.txt
      - name: Pull Request öffnen
        if: steps.access.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Keine Änderungen."; exit 0; fi
          branch="installs-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Skill-Katalog: Installationszahlen nachgezogen"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "Skill-Katalog: Installationszahlen $(date +%Y-%m)" \
            --body "Automatisch von skills.sh nachgezogen. Die Zahlen erreichen die Nutzer mit dem nächsten Release des Add-ons.

          $(cat /tmp/installs.txt)"
