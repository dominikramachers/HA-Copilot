name: Agent signieren

# Beim Veröffentlichen eines Releases: die Programme des Server-Agenten bauen, mit dem Schlüssel aus dem Secret AGENT_SIGNING_KEY
# signieren und als Dateien an das Release hängen. Das Add-on holt sie beim Bauen (copilot/agent/fetch-signed.sh) und prüft sie mit
# dem öffentlichen Schlüssel copilot/agent/update_key.pub. Einrichtung: SECURITY.md, Abschnitt "Agenten-Programme signieren".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag des Releases, z. B. v0.61.0 (nachträglich signieren oder erneut versuchen)"
        required: true

permissions:
  contents: write # Dateien an das Release hängen

concurrency:
  group: release-agent-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    name: Agent bauen und signieren
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Nur Stände auf main und mit passender Version signieren
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Unerwarteter Tag: $TAG"; exit 1 ;; esac
          VERSION="${TAG#v}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Der Stand von $TAG liegt nicht auf main. Es wird nur signiert, was auf main gelandet ist."
            exit 1
          fi
          CONFIG_VERSION=$(sed -n 's/^version: "\(.*\)"$/\1/p' copilot/config.yaml | head -n 1)
          if [ "$CONFIG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $CONFIG_VERSION in copilot/config.yaml."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: copilot/agent/go.mod
          cache-dependency-path: copilot/agent/go.sum

      - name: Bauen
        working-directory: copilot/agent
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=vendor
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$RUNNER_TEMP/out/copilot-agent-linux-$arch" ./cmd/copilot-agent
          done
          go build -trimpath -o "$RUNNER_TEMP/copilot-sign" ./cmd/copilot-sign

      - name: Signieren
        env:
          COPILOT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$COPILOT_SIGNING_KEY" ]; then
            echo "::error::Das Secret AGENT_SIGNING_KEY fehlt. Einrichtung: SECURITY.md, Abschnitt 'Agenten-Programme signieren'."
            exit 1
          fi
          # Der öffentliche Schlüssel im Repository muss zum privaten im Secret passen, sonst würde jede Signatur abgelehnt.
          PUB=$("$RUNNER_TEMP/copilot-sign" pub)
          if [ "$PUB" != "$(tr -d ' \r\n' < copilot/agent/update_key.pub)" ]; then
            echo "::error::copilot/agent/update_key.pub passt nicht zum Secret AGENT_SIGNING_KEY."
            exit 1
          fi
          for arch in amd64 arm64; do
            f="$RUNNER_TEMP/out/copilot-agent-linux-$arch"
            "$RUNNER_TEMP/copilot-sign" sign -version "$VERSION" -arch "$arch" -file "$f" > "$f.sig"
            "$RUNNER_TEMP/copilot-sign" verify -pub copilot/agent/update_key.pub -version "$VERSION" -arch "$arch" -file "$f" -sig "$f.sig"
          done
          (cd "$RUNNER_TEMP/out" && sha256sum copilot-agent-linux-* > SHA256SUMS)

      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP"/out/copilot-agent-linux-* "$RUNNER_TEMP/out/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
