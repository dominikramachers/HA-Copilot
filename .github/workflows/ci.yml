name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            copilot/requirements.txt
            copilot/requirements-files.txt
      - name: Abhängigkeiten installieren
        working-directory: copilot
        run: |
          pip install -r requirements.txt pytest pyyaml
          pip install -r requirements-files.txt
      - name: Tests
        working-directory: copilot
        run: python -m pytest -q

  addon-lint:
    name: Add-on-Konfiguration prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./copilot

  docker-build:
    name: Image bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image bauen (ohne Veröffentlichung)
        run: docker build copilot
