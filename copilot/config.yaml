name: HA Copilot
version: "0.59.2"
slug: copilot
url: https://github.com/dominikramachers/HA-Copilot
description: Privater KI-Chat in Home Assistant mit getrennten Chats pro Profil
arch:
  - amd64
  - aarch64

# Sicherung im gestoppten Zustand: Home Assistant hält das Add-on kurz an, kopiert die Datenbank und startet es wieder.
# So ist die Kopie immer vollständig (eine laufende SQLite-Datei kann sonst mitten im Schreiben kopiert werden).
backup: cold

# Zugang innerhalb von Home Assistant (Sidebar-Panel, Authentifizierung durch HA)
ingress: true
ingress_entry: /
panel_icon: mdi:robot-happy-outline
panel_title: HA Copilot
panel_admin: false

# Home-Assistant-Anbindung: Benutzernamen zu IDs auflösen, Theme-Farben übernehmen und (je nach Rechtestufe des Benutzers)
# der KI Zugriff auf Home Assistant geben (lesen, ausführen, schreiben; siehe ha_access_default)
homeassistant_api: true

# Ordner „addon_config“: hier liegen eigenes Logo (logo.png), Symbol (icon.png) und optional custom.css.
# In Home Assistant erreichbar unter /addon_configs/<Ordnername>/ (z. B. per Samba oder Datei-Editor).
map:
  - app_config:rw

# Direktzugang für die Domain (Cloudflare Tunnel) mit Entra-Anmeldung. Standardmäßig
# NICHT nach außen gemappt (null) und abgeschaltet (solange public_base_url leer ist).
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Domain-Zugang (Ziel des Cloudflare Tunnels, nicht ins Internet öffnen)

options:
  users:
    profiles:
      - label: Administrator
    all_ha_users: false
    ha_users_excluded: ""
  chat:
    anthropic_api_key: ""
    claude_oauth_token: ""
    claude_token_expires: ""
    model: claude-sonnet-5-5
    memory_enabled: true
    schedules_enabled: true
    incognito_enabled: true
    sharing: instance
    research_enabled: false
    research_daily_limit: 3
    usd_eur_rate: 0.92
    files_enabled: true
    ha_access_default: execute
    ha_limit_to_exposed: true
    connector_access_default: use
    openai_enabled: false
    openai_api_key: ""
    openai_key_expires: ""
    openai_models: "gpt-5.6-terra, gpt-5.6-luna, gpt-5.6-sol"
    openai_limit_month: 3000
  images:
    openai_api_key: ""
    google_api_key: ""
    openai_key_expires: ""
    google_key_expires: ""
    provider: auto
    limit_month: 30
  voice:
    access_default: "off"
    browser_stt: true
    output: device
    openai_voice: nova
    instructions: ""
    chat_days: 30
    openai_api_key: ""
    openai_key_expires: ""
  domain:
    public_base_url: ""
    ha_url: ""
    entra_tenant_id: ""
    entra_client_id: ""
    entra_client_secret: ""
    entra_secret_expires: ""
    session_days: 30
    public_trusted_proxies: []
    app_access: false
    device_days: 90
  look:
    app_name: HA Copilot
    language: de
    login_text: ""
    login_placeholder: ""
    logo_tile: false
    follow_ha_theme: true
    theme_name: ""
  global:
    restore_snapshot: ""
    export_database: false

schema:
  users:
    profiles:
      - ha_user: str?
        label: str?
        ha_user_id: "match(^[0-9a-fA-F]{32}$)?"
        entra_upn: str?
        ha_access: list(none|read|execute|write)?
        connector_access: list(none|use|own|global)?
        web_access: list(on|off)?
        voice_access: list(on|off)?
        admin: bool?
        notify_service: str?
        id: "match(^[a-z0-9_-]{2,32}$)?"
    all_ha_users: bool?
    ha_users_excluded: str?
  chat:
    anthropic_api_key: password?
    claude_oauth_token: password?
    claude_token_expires: str?
    model: str?
    memory_enabled: bool?
    schedules_enabled: bool?
    incognito_enabled: bool?
    sharing: list(off|instance|public)?
    research_enabled: bool?
    research_daily_limit: int(1,20)?
    usd_eur_rate: float(0.1,10)?
    files_enabled: bool?
    ha_access_default: list(none|read|execute|write)?
    ha_limit_to_exposed: bool?
    connector_access_default: list(none|use|own|global)?
    openai_enabled: bool?
    openai_api_key: password?
    openai_key_expires: str?
    openai_models: str?
    openai_limit_month: int(0,100000)?
  images:
    openai_api_key: password?
    google_api_key: password?
    openai_key_expires: str?
    google_key_expires: str?
    provider: list(auto|openai|google)?
    limit_month: int(0,10000)?
  voice:
    access_default: list(on|off)?
    browser_stt: bool?
    output: list(device|service)?
    openai_voice: list(alloy|ash|ballad|coral|echo|fable|nova|onyx|sage|shimmer|verse)?
    instructions: str?
    chat_days: int(0,365)?
    openai_api_key: password?
    openai_key_expires: str?
  domain:
    public_base_url: str?
    ha_url: str?
    entra_tenant_id: str?
    entra_client_id: str?
    entra_client_secret: password?
    entra_secret_expires: str?
    session_days: int(1,90)?
    public_trusted_proxies:
      - str
    app_access: bool?
    device_days: int(1,180)?
  look:
    app_name: str?
    language: list(de|en)?
    login_text: str?
    login_placeholder: str?
    logo_tile: bool?
    follow_ha_theme: bool?
    theme_name: str?
  global:
    restore_snapshot: str?
    export_database: bool?
