configuration:
  users:
    name: Benutzer
    description: 'Wer die App nutzen darf: die Benutzerliste, der Zugang für alle Home-Assistant-Benutzer und wer ausgeschlossen ist.'
    fields:
      profiles:
        name: Benutzer (Profile)
        description: Wer die App nutzen darf. „Hinzufügen“ legt einen weiteren Benutzer an; meist genügt der Home-Assistant-Benutzername, alles andere ist optional. Wer noch nicht eingetragen ist, sieht in der App seinen Benutzernamen und seine ID zum Eintragen. Nach dem Speichern das Add-on neu starten.
        fields:
          ha_user:
            name: Home-Assistant-Benutzername
            description: Anmeldename oder Person des Benutzers in Home Assistant (z. B. „doralab“). Das Add-on ermittelt daraus die ID. Alternativ die ID unten eintragen.
          label:
            name: Anzeigename (optional)
            description: Name, der in der App angezeigt wird. Leer lassen, dann gilt der Home-Assistant-Benutzername.
          ha_user_id:
            name: Home-Assistant-Benutzer-ID (optional)
            description: 32 Zeichen. Nur nötig, wenn der Benutzername nicht eindeutig ist. Im Add-on-Protokoll stehen beim Start alle Benutzer mit ihren IDs.
          entra_upn:
            name: E-Mail / UPN für die Domain-Anmeldung (optional)
            description: Konto, mit dem sich die Person über die öffentliche Domain per Microsoft Entra anmeldet.
          ha_access:
            name: Zugriff auf Home Assistant (optional)
            description: 'Was die KI für diesen Benutzer in Home Assistant darf: none = nichts, read = lesen, execute = lesen und ausführen (Geräte schalten), write = lesen, ausführen und ändern (Automationen, Skripte, Dashboards, Helfer). Leer: es gilt der Standard dieser Option in der Gruppe „Chat (Claude & OpenAI)“ bzw. „Sprechen mit der KI“.'
          connector_access:
            name: Konnektoren (optional)
            description: 'Was die KI für diesen Benutzer bei Konnektoren (MCP-Server wie Microsoft 365, Google Workspace oder Zabbix) darf: none = keine, use = freigegebene (globale) Konnektoren nutzen, own = zusätzlich eigene anlegen, global = zusätzlich globale Konnektoren für alle anlegen und ändern (auch Adressen im Heimnetz). Leer: es gilt der Standard dieser Option in der Gruppe „Chat (Claude & OpenAI)“ bzw. „Sprechen mit der KI“.'
          web_access:
            name: Websuche (optional)
            description: 'on = die KI darf für diesen Benutzer im Web suchen und Seiten lesen, off = nicht. Leer: es gilt der Standard dieser Option in der Gruppe „Chat (Claude & OpenAI)“ bzw. „Sprechen mit der KI“.'
          voice_access:
            name: Sprechen mit der KI (optional)
            description: 'on = diese Person darf per Sprache mit der KI sprechen (Mikrofon-Knopf im Chat), off = nicht. Leer: es gilt der Standard dieser Option in der Gruppe „Chat (Claude & OpenAI)“ bzw. „Sprechen mit der KI“.'
          admin:
            name: Administrator der App (optional)
            description: 'An = diese Person sieht unter Einstellungen → Nutzung die Übersicht „Alle Personen“ (wer wie viel genutzt hat, nur Zahlen, keine Inhalte). Administratoren von Home Assistant sind es automatisch; dieses Feld ist für Personen, die in Home Assistant keine Administratoren sind, oder für die Anmeldung über die Domain. Leer/aus: nur wer in Home Assistant Administrator ist.'
          notify_service:
            name: Benachrichtigungsdienst (optional)
            description: 'Home-Assistant-Dienst, über den dieser Benutzer aufs Handy benachrichtigt wird, z. B. notify.mobile_app_pixel (siehe Entwicklerwerkzeuge → Aktionen, Suche „notify“). Vorgabe für die Geräte dieser Person (jede Person wählt ihre Geräte selbst unter Einstellungen → Benachrichtigungen; ohne Auswahl gelten die Geräte ihrer Person in Home Assistant). Leer: keine Vorgabe.'
          id:
            name: Kurzname (optional)
            description: 'Interne Kennung, a–z, 0–9, Bindestrich. Leer lassen: wird aus dem Anzeigenamen gebildet. Nachträglich nicht mehr ändern, die Chats hängen daran.'
      all_ha_users:
        name: Alle Home-Assistant-Benutzer zulassen
        description: 'Aus (Standard): nur die oben eingetragenen Benutzer. An: jeder Home-Assistant-Benutzer darf die App nutzen und bekommt beim ersten Zugriff automatisch ein eigenes Profil mit eigenen Chats. Eingetragene Benutzer behalten ihr Profil. Eintragen ist dann nur noch nötig für Anzeigename oder Microsoft-Anmeldung.'
      ha_users_excluded:
        name: Ausgeschlossene Home-Assistant-Benutzer (optional)
        description: 'Nur mit „Alle Home-Assistant-Benutzer zulassen“: Benutzernamen, Namen oder IDs, durch Komma getrennt (z. B. „kind1, gast“). Diese Benutzer kommen nicht herein.'
  chat:
    name: Chat (Claude & OpenAI)
    description: Zugang zu Claude (Abo-Token oder API-Schlüssel) und optional zu ChatGPT (OpenAI), Modell, Gedächtnis, geplante Aufgaben, Dateien, der Zugriff auf Home Assistant und die Standards für GitHub und Konnektoren.
    fields:
      anthropic_api_key:
        name: Anthropic-API-Schlüssel
        description: Alternative zum Abo-Token (Abrechnung nach Verbrauch über die Claude-Konsole). Hat Vorrang, wenn beides eingetragen ist.
      claude_oauth_token:
        name: Claude-Zugangstoken (Abo)
        description: Langzeit-Token aus „claude setup-token“ (Claude-Abo). NUR für den eigenen, persönlichen Gebrauch. Mehrere Benutzer oder die Domain-Seite brauchen einen API-Schlüssel (Anthropic-Nutzungsbedingungen beachten). Ohne Token und ohne API-Schlüssel läuft nur der Testmodus.
      claude_token_expires:
        name: Claude-Token läuft ab am
        description: Datum (JJJJ-MM-TT) für die Erinnerung in der App.
      model:
        name: Standard-Modell
        description: Modell für neue Chats, z. B. claude-sonnet-5-5. In der Oberfläche kann man es je Chat wechseln (Opus und Haiku stehen zusätzlich zur Wahl).
      memory_enabled:
        name: Gedächtnis der KI
        description: 'An (Standard): Die KI merkt sich Fakten selbstständig, für den ganzen Haushalt und getrennt für jede Person. Jeder kann die Einträge im Chat unter „Gedächtnis“ ansehen, ändern und löschen. Aus: kein Gedächtnis.'
      schedules_enabled:
        name: Geplante Aufgaben erlauben
        description: 'An (Standard): Menüpunkt „Geplant“, in dem die KI zu festen Zeiten Aufgaben erledigt (nur lesend, ohne Rückfragen). Aus: keine geplanten Aufgaben, bestehende ruhen. Geplante Läufe verbrauchen Kontingent deines Abos.'
      incognito_enabled:
        name: Inkognito-Chat erlauben
        description: 'An (Standard): Neben „Neuer Chat“ gibt es das Gespenster-Symbol für einen Inkognito-Chat. Er steht in keiner Liste und Suche, nutzt und ändert kein Gedächtnis, wird nicht exportiert und beim Schließen gelöscht. Aus: kein Inkognito-Chat.'
      sharing:
        name: Chats teilen
        description: 'instance (Standard): Chats lassen sich mit allen Personen in dieser Instanz teilen (lesen oder als Kopie weiterführen). public: zusätzlich ein öffentlicher Link ohne Anmeldung (nur lesen, nur über den Domain-Zugang, mit Ablauf und jederzeit widerrufbar). off: kein Teilen. Inkognito-Chats lassen sich nie teilen.'
      research_enabled:
        name: Deep Research erlauben
        description: 'Aus (Standard): keine Tiefenrecherche. An: Im Chat-Menü (unter dem Eingabefeld) lässt sich „Deep Research“ einschalten. Die KI plant dann die Recherche, sucht in mehreren Runden im Web, liest und gleicht Quellen ab und schreibt einen Bericht mit Quellenliste, den du im Projekt ablegen kannst. Ein Lauf dauert mehrere Minuten und verbraucht deutlich mehr Kontingent als eine normale Antwort; vor dem Start gibt es eine Rückfrage. Dafür muss die Websuche für die Person an sein.'
      research_daily_limit:
        name: Deep Research je Person und Tag
        description: 'Wie viele Deep-Research-Läufe eine Person pro Tag starten darf (1 bis 20, Standard 3). Gilt nur, wenn Deep Research erlaubt ist. Jeder Lauf ist zusätzlich begrenzt: höchstens 6 Fragen plus 2 Nachrecherchen, höchstens 12 gelesene Seiten je Frage und 30 Minuten.'
      usd_eur_rate:
        name: Euro je US-Dollar (Verbrauchsübersicht)
        description: 'Umrechnungskurs für den Wert in der Übersicht „Alle Personen“ (Einstellungen → Nutzung, nur für Administratoren): Claude meldet den Verbrauch in US-Dollar, bei deutscher Sprache wird er mit diesem Kurs in Euro angezeigt (Standard 0,92). Bei englischer Sprache steht der Wert in US-Dollar.'
      files_enabled:
        name: Dateien erzeugen
        description: 'An (Standard): Die KI kann auf Wunsch Dateien erstellen (Word, Excel, PowerPoint, PDF sowie Skripte und andere Textdateien) und im Chat zum Herunterladen anbieten. Aus: nur Text und Codeblöcke.'
      ha_access_default:
        name: Standard-Zugriff auf Home Assistant
        description: 'Gilt für alle Benutzer ohne eigene Angabe: none, read, execute (Standard) oder write. Bei read und execute sieht und steuert die KI nur Entitäten, die in Home Assistant für Assist freigegeben sind (siehe nächste Option).'
      ha_limit_to_exposed:
        name: Nur für Assist freigegebene Entitäten (lesen/ausführen)
        description: 'An (Standard): Benutzer mit read oder execute sehen und steuern nur Entitäten, die in Home Assistant unter Einstellungen → Sprachassistenten → Freigeben für Assist freigegeben sind. Benutzer mit write sind davon nicht betroffen.'
      connector_access_default:
        name: Standard-Recht für Konnektoren
        description: 'Gilt für alle Benutzer ohne eigene Angabe: none, use (Standard: globale Konnektoren nutzen), own (zusätzlich eigene anlegen) oder global (zusätzlich globale verwalten). Konnektoren verbinden die KI mit Diensten außerhalb von Home Assistant; was sie darüber liest, behandelt sie wie fremde Inhalte.'
      openai_enabled:
        name: ChatGPT (OpenAI) im Chat erlauben
        description: 'Aus (Standard): nur Claude. An (und Schlüssel eingetragen): ChatGPT-Modelle stehen im Chat zur Wahl, mit Home-Assistant-Steuerung, Gedächtnis, Dateien, Bildern, GitHub, Konnektoren, Websuche und geplanten Aufgaben. Was in einem ChatGPT-Chat geschrieben wird, geht an OpenAI (nie an Claude), in einem Claude-Chat nie an OpenAI. Sprechen mit der KI bleibt immer bei Claude Haiku.'
      openai_api_key:
        name: OpenAI-API-Schlüssel (Chat)
        description: 'Schlüssel von platform.openai.com (API keys) für die ChatGPT-Modelle; ein ChatGPT-Abo reicht dafür nicht, das API-Konto braucht eigenes Guthaben. Leer: der Schlüssel aus „Bilder“ wird mitbenutzt.'
      openai_key_expires:
        name: OpenAI-Schlüssel (Chat) läuft ab am
        description: Datum (JJJJ-MM-TT) für die Erinnerung in der App; 30 Tage vorher erscheint ein Hinweis im Chat.
      openai_models:
        name: ChatGPT-Modelle
        description: 'Modelle, die im Chat zur Wahl stehen (höchstens 6), durch Komma getrennt. Standard: gpt-5.6-terra, gpt-5.6-luna, gpt-5.6-sol. Der erste Eintrag ist die erste Wahl der Liste. Leer: Standardliste.'
      openai_limit_month:
        name: ChatGPT-Token im Monat, alle zusammen (in Tausend)
        description: Wie viele Token (Eingabe plus Ausgabe) alle Personen zusammen im Monat mit ChatGPT-Modellen verbrauchen dürfen, in Tausend (Standard 3000 = 3 Millionen, 0 = kein Limit). Darüber fragt der Chat vor jeder weiteren Antwort nach (Zulassen oder Ablehnen).
  images:
    name: Bilder
    description: Die KI erzeugt Bilder von selbst. SVG-Grafiken zeichnet sie kostenlos; für Fotos und Kunstbilder braucht es einen Schlüssel von OpenAI oder Google (beides optional).
    fields:
      openai_api_key:
        name: OpenAI-API-Schlüssel (Bilder)
        description: 'Schlüssel von platform.openai.com (API keys). Nötig für Bilder von OpenAI (und, wenn bei „Sprechen mit der KI“ kein eigener Schlüssel steht, auch für die Spracherkennung); ein ChatGPT-Abo reicht dafür nicht, das API-Konto braucht eigenes Guthaben. Bildwunsch und Referenzbilder werden an OpenAI übertragen. Leer: keine Bilder von OpenAI.'
      google_api_key:
        name: Google-API-Schlüssel (Bilder)
        description: 'Schlüssel für die Gemini-API von aistudio.google.com (Get API key) mit aktivierter Abrechnung; ein Google-Abo reicht dafür nicht. Bildwunsch und Referenzbilder werden an Google übertragen. Leer: keine Bilder von Google.'
      openai_key_expires:
        name: OpenAI-Schlüssel läuft ab am
        description: Datum (JJJJ-MM-TT) für die Erinnerung in der App. Bei platform.openai.com unter „API keys“ steht, ob und wann der Schlüssel abläuft; 30 Tage vorher erscheint ein Hinweis im Chat.
      google_key_expires:
        name: Google-Schlüssel läuft ab am
        description: Datum (JJJJ-MM-TT) für die Erinnerung in der App. Bei aistudio.google.com unter „API keys“ bzw. in der Google Cloud Console steht, ob und wann der Schlüssel abläuft; 30 Tage vorher erscheint ein Hinweis im Chat.
      provider:
        name: Bildanbieter
        description: 'auto (Standard): Die KI wählt je Bild, Google für Entwürfe und Änderungen (günstiger), OpenAI für Bilder mit Schrift oder höchster Qualität. openai oder google: immer dieser Anbieter. Ist nur ein Schlüssel eingetragen, wird dieser genommen.'
      limit_month:
        name: Bilder im Monat, alle zusammen
        description: Wie viele Bilder von OpenAI oder Google alle Personen zusammen im Monat erzeugen dürfen (Standard 30, 0 = kein Limit). Darüber fragt der Chat vor jedem weiteren Bild nach (Zulassen oder Ablehnen). SVG-Zeichnungen der KI zählen nicht, sie kosten nichts.
  voice:
    name: Sprechen mit der KI
    description: Alles zum Sprechen mit der KI (Mikrofon-Knopf im Chat) in einer Gruppe. Wer sprechen darf, steht hier als Standard und je Benutzer bei „Sprechen mit der KI“ (voice_access).
    fields:
      access_default:
        name: Standard – wer darf sprechen
        description: 'Gilt für alle Benutzer ohne eigene Angabe: off (Standard) = niemand, on = alle.'
      browser_stt:
        name: Spracherkennung des Browsers nutzen
        description: 'An (Standard): Ohne OpenAI-Schlüssel und ohne Spracherkennung in Home Assistant nutzt die App die kostenlose Spracherkennung des Browsers (Chrome, Edge, Safari; fehlt in Firefox). Der Ton geht dabei an Google bzw. Apple, nicht an dieses Add-on. Aus: dann geht Sprechen nur mit OpenAI-Schlüssel oder Home Assistant.'
      output:
        name: Stimme
        description: device (Standard) = die Antwort liest das Gerät vor, kostenlos. service = derselbe Dienst wie die Spracherkennung liest vor (OpenAI oder Home Assistant), klingt besser, kostet bei OpenAI wenige Cent.
      openai_voice:
        name: Stimme bei OpenAI
        description: 'Gilt nur, wenn die Stimme von OpenAI kommt (Stimme: service und OpenAI-Schlüssel). Standard nova (weiblich). Weiblich klingen meist nova, shimmer, coral und sage; männlich echo, onyx und ash; alloy, fable, ballad und verse liegen dazwischen oder wirken je nach Satz anders. Zum Ausprobieren auf platform.openai.com/audio/playground.'
      instructions:
        name: Eigene Wünsche an die gesprochenen Antworten (optional)
        description: 'Ein bis drei Sätze, die die KI bei jeder gesprochenen Antwort zusätzlich beachtet, zum Beispiel „Nenne Räume immer beim Namen“ oder „Antworte in einem Satz“. Höchstens 600 Zeichen. Leer: nur die Grundregeln (kurz, wie man spricht, keine Gerätenamen).'
      chat_days:
        name: Sprachgespräche aufbewahren (Tage)
        description: Sprachgespräche, die nicht in einem Chat begonnen wurden, stehen nicht in der Chatliste und werden nach so vielen Tagen gelöscht (Standard 30, 0 = behalten). Angeheftete bleiben.
      openai_api_key:
        name: OpenAI-Schlüssel nur für die Sprache (optional)
        description: 'Schlüssel von platform.openai.com (API keys) für die Spracherkennung (und die Stimme bei output: service); wenige Cent pro Stunde Sprache, das API-Konto braucht eigenes Guthaben. Leer: es gilt der OpenAI-Schlüssel der Gruppe „Bilder“, und ist auch der leer, die Spracherkennung des Browsers. Aufnahmen gehen an OpenAI.'
      openai_key_expires:
        name: OpenAI-Schlüssel (Sprache) läuft ab am
        description: Datum (JJJJ-MM-TT) für die Erinnerung in der App, nur für den eigenen Schlüssel dieser Gruppe. 30 Tage vorher erscheint ein Hinweis im Chat. Ohne eigenen Schlüssel gilt das Datum bei „Bilder“ (images.openai_key_expires).
  domain:
    name: Domain-Zugang (Entra)
    description: 'Optional: Zugang über eine eigene Domain mit Microsoft-Entra- oder Home-Assistant-Anmeldung. Der Zugang ist an, sobald die öffentliche Adresse und eine Anmeldung eingetragen sind.'
    fields:
      public_base_url:
        name: Öffentliche Adresse
        description: z. B. https://chat.example.org. Muss zur Redirect-URI der Entra-App passen. Der Domain-Zugang ist an, sobald diese Adresse und eine Anmeldung (Entra oder ha_url) eingetragen sind.
      ha_url:
        name: Adresse von Home Assistant für die Anmeldung über die Domain (optional)
        description: 'Nur wenn sich Benutzer über die Domain mit ihrem Home-Assistant-Konto anmelden sollen: von außen erreichbare Adresse, z. B. https://ha.example.org. Dann erscheint auf der Anmeldeseite „Mit Home Assistant anmelden“. Leer lassen: nur Microsoft Entra.'
      entra_tenant_id:
        name: 'Entra: Verzeichnis-ID (Tenant)'
      entra_client_id:
        name: 'Entra: Anwendungs-ID (Client)'
      entra_client_secret:
        name: 'Entra: geheimer Clientschlüssel'
      entra_secret_expires:
        name: Entra-Schlüssel läuft ab am
        description: Datum (JJJJ-MM-TT) für die Erinnerung in der App.
      session_days:
        name: Anmeldedauer (Tage)
        description: Wie lange eine Anmeldung über die Domain gültig bleibt (1–90).
      public_trusted_proxies:
        name: Vertrauenswürdige Proxys
        description: Adressen von Reverse-Proxys (z. B. Cloudflare-Tunnel-Container), deren Weiterleitungs-Header gelten dürfen.
  look:
    name: Personalisierung
    description: 'Alles optional: Name, Sprache, Anmeldeseite, Logo und Farben.'
    fields:
      app_name:
        name: App-Name
        description: 'Name in Anmeldeseite, Titel und Seitenleiste. Standard: HA Copilot. Der Name des Eintrags in der Home-Assistant-Seitenleiste ist fest und lässt sich hier nicht ändern.'
      language:
        name: Sprache
        description: de (Standard) für Deutsch oder en für Englisch. Gilt für die Oberfläche, die Meldungen des Add-ons und die Standardsprache der KI-Antworten (wer in einer anderen Sprache schreibt, bekommt die Antwort weiterhin in dieser Sprache). Bereits gespeicherte Chats bleiben unverändert.
      login_text:
        name: Text auf der Anmeldeseite
        description: Kurzer Satz unter dem Namen, z. B. „Anmelden mit deinem Firmenkonto.“
      login_placeholder:
        name: Beispiel-Adresse im Anmeldefeld
        description: Platzhalter im E-Mail-Feld der Anmeldeseite, z. B. name@firma.de.
      logo_tile:
        name: Logo auf dunkler Kachel
        description: 'Für Logos, die nur auf dunklem Grund gut aussehen (z. B. helle oder neonfarbene Logos): zeigt sie im hellen Design auf einer dunklen Kachel.'
      follow_ha_theme:
        name: Home-Assistant-Theme übernehmen
        description: 'An: Farben und Hell/Dunkel folgen live dem aktiven Theme von Home Assistant (in der Seitenleiste von HA) bzw. dem Standard-Theme (über die Domain). Aus: eingebaute Farben mit eigenem Hell/Dunkel-Schalter.'
      theme_name:
        name: Theme für die Domain (optional)
        description: 'Name eines Home-Assistant-Themes, das über die Domain gelten soll. Leer: Standard-Theme von Home Assistant.'
  global:
    name: Globale Einstellungen
    description: Daten und Sicherung. Normalerweise leer bzw. aus; nur für Wiederherstellung und Umzug.
    fields:
      restore_snapshot:
        name: Datenbank wiederherstellen
        description: 'Nur im Notfall: Name eines Snapshots, der beim nächsten Start eingespielt wird. Danach leeren.'
      export_database:
        name: Datenbank exportieren (Umzug)
        description: 'Nur für den Umzug in ein anderes Add-on (z. B. vom lokalen Add-on zum GitHub-Add-on): Beim Start wird eine Kopie aller Chats als copilot-export.sqlite3 in den Config-Ordner des Add-ons gelegt. Danach ausschalten und die Datei löschen.'
network:
  8100/tcp: Domain-Zugang (Cloudflare Tunnel)
