configuration:
  profiles:
    name: Benutzer (Profile)
    description: Wer die App nutzen darf. „Hinzufügen“ legt einen weiteren Benutzer an; meist genügt der Home-Assistant-Benutzername, alles andere ist optional. Wer noch nicht eingetragen ist, sieht in der App seinen Benutzernamen und seine ID zum Eintragen. Nach dem Speichern das Add-on neu starten.
    fields:
      ha_user:
        name: Home-Assistant-Benutzername
        description: Anmeldename oder Person des Benutzers in Home Assistant (z. B. „doralab“). Das Add-on ermittelt daraus die ID. Alternativ die ID unten eintragen.
      label:
        name: Anzeigename (optional)
        description: Name, der in der App angezeigt wird. Leer lassen, dann gilt der Home-Assistant-Benutzername.
      ha_user_id:
        name: Home-Assistant-Benutzer-ID (optional)
        description: 32 Zeichen. Nur nötig, wenn der Benutzername nicht eindeutig ist. Im Add-on-Protokoll stehen beim Start alle Benutzer mit ihren IDs.
      entra_upn:
        name: E-Mail / UPN für die Domain-Anmeldung (optional)
        description: Konto, mit dem sich die Person über die öffentliche Domain per Microsoft Entra anmeldet.
      ha_access:
        name: Zugriff auf Home Assistant (optional)
        description: 'Was die KI für diesen Benutzer in Home Assistant darf: none = nichts, read = lesen, execute = lesen und ausführen (Geräte schalten), write = lesen, ausführen und ändern (Automationen, Skripte, Dashboards, Helfer). Leer: es gilt der Standard unten.'
      github_access:
        name: GitHub-Zugriff (optional)
        description: 'Was die KI für diesen Benutzer bei GitHub darf: none = nichts, read = Repositories lesen, write = lesen und ändern (Dateien einchecken, Pull Requests, Issues, Repositories anlegen). Leer: es gilt der Standard unten. Das Token gehört dir als Betreiber: jeder Benutzer mit read oder write sieht damit auch deine privaten Repositories (außer die Freigabeliste schränkt es ein).'
      web_access:
        name: Websuche (optional)
        description: 'on = die KI darf für diesen Benutzer im Web suchen und Seiten lesen, off = nicht. Leer: es gilt der Standard unten.'
      notify_service:
        name: Benachrichtigungsdienst (optional)
        description: 'Home-Assistant-Dienst, über den dieser Benutzer aufs Handy benachrichtigt wird, z. B. notify.mobile_app_pixel (siehe Entwicklerwerkzeuge → Aktionen, Suche „notify“). Damit meldet sich die KI, wenn eine längere Antwort fertig ist, während niemand zusieht, und geplante Aufgaben können aufs Handy melden. Leer: keine Benachrichtigung aufs Handy.'
      id:
        name: Kurzname (optional)
        description: 'Interne Kennung, a–z, 0–9, Bindestrich. Leer lassen: wird aus dem Anzeigenamen gebildet. Nachträglich nicht mehr ändern, die Chats hängen daran.'
  all_ha_users:
    name: Alle Home-Assistant-Benutzer zulassen
    description: 'Aus (Standard): nur die oben eingetragenen Benutzer. An: jeder Home-Assistant-Benutzer darf die App nutzen und bekommt beim ersten Zugriff automatisch ein eigenes Profil mit eigenen Chats. Eingetragene Benutzer behalten ihr Profil. Eintragen ist dann nur noch nötig für Anzeigename oder Microsoft-Anmeldung.'
  ha_users_excluded:
    name: Ausgeschlossene Home-Assistant-Benutzer (optional)
    description: 'Nur mit „Alle Home-Assistant-Benutzer zulassen“: Benutzernamen, Namen oder IDs, durch Komma getrennt (z. B. „kind1, gast“). Diese Benutzer kommen nicht herein.'
  ha_url:
    name: Adresse von Home Assistant für die Anmeldung über die Domain (optional)
    description: 'Nur wenn sich Benutzer über die Domain mit ihrem Home-Assistant-Konto anmelden sollen: von außen erreichbare Adresse, z. B. https://ha.example.org. Dann erscheint auf der Anmeldeseite „Mit Home Assistant anmelden“. Leer lassen: nur Microsoft Entra.'
  app_name:
    name: App-Name
    description: 'Name in Anmeldeseite, Titel und Seitenleiste. Standard: HA Copilot. Der Name des Eintrags in der Home-Assistant-Seitenleiste ist fest und lässt sich hier nicht ändern.'
  login_text:
    name: Text auf der Anmeldeseite
    description: Kurzer Satz unter dem Namen, z. B. „Anmelden mit deinem Firmenkonto.“
  login_placeholder:
    name: Beispiel-Adresse im Anmeldefeld
    description: Platzhalter im E-Mail-Feld der Anmeldeseite, z. B. name@firma.de.
  logo_tile:
    name: Logo auf dunkler Kachel
    description: 'Für Logos, die nur auf dunklem Grund gut aussehen (z. B. helle oder neonfarbene Logos): zeigt sie im hellen Design auf einer dunklen Kachel.'
  follow_ha_theme:
    name: Home-Assistant-Theme übernehmen
    description: 'An: Farben und Hell/Dunkel folgen live dem aktiven Theme von Home Assistant (in der Seitenleiste von HA) bzw. dem Standard-Theme (über die Domain). Aus: eingebaute Farben mit eigenem Hell/Dunkel-Schalter.'
  theme_name:
    name: Theme für die Domain (optional)
    description: 'Name eines Home-Assistant-Themes, das über die Domain gelten soll. Leer: Standard-Theme von Home Assistant.'
  accent_color:
    name: Akzentfarbe
    description: 'Hex-Wert wie #175CD3. Überschreibt die Akzentfarbe aus dem Theme. Leer: aus dem Theme.'
  background_color_light:
    name: Hintergrund hell
    description: 'Hex-Wert wie #F3F4F6. Leer: aus dem Theme.'
  background_color_dark:
    name: Hintergrund dunkel
    description: 'Hex-Wert wie #0D192D. Leer: aus dem Theme.'
  card_color_light:
    name: Flächen hell
    description: 'Farbe von Karten und Eingabefeldern im hellen Design. Leer: aus dem Theme.'
  card_color_dark:
    name: Flächen dunkel
    description: 'Farbe von Karten und Eingabefeldern im dunklen Design. Leer: aus dem Theme.'
  text_color_light:
    name: Schrift hell
    description: 'Textfarbe im hellen Design. Leer: aus dem Theme.'
  text_color_dark:
    name: Schrift dunkel
    description: 'Textfarbe im dunklen Design. Leer: aus dem Theme.'
  public_enabled:
    name: Domain-Zugang aktivieren
    description: Schaltet den Zugang über die öffentliche Domain (Port 8100) ein, mit Microsoft Entra und/oder (mit Adresse von Home Assistant) der Anmeldung über Home Assistant.
  public_base_url:
    name: Öffentliche Adresse
    description: z. B. https://chat.example.org. Muss zur Redirect-URI der Entra-App passen.
  entra_tenant_id:
    name: 'Entra: Verzeichnis-ID (Tenant)'
  entra_client_id:
    name: 'Entra: Anwendungs-ID (Client)'
  entra_client_secret:
    name: 'Entra: geheimer Clientschlüssel'
  session_days:
    name: Anmeldedauer (Tage)
    description: Wie lange eine Anmeldung über die Domain gültig bleibt (1–90).
  public_trusted_proxies:
    name: Vertrauenswürdige Proxys
    description: Adressen von Reverse-Proxys (z. B. Cloudflare-Tunnel-Container), deren Weiterleitungs-Header gelten dürfen.
  backend:
    name: Antwortquelle
    description: 'echo: Testbetrieb ohne KI. claude: echte Antworten über das Claude-Abo.'
  claude_oauth_token:
    name: Claude-Zugangstoken (Abo)
    description: Langzeit-Token aus „claude setup-token“ (Claude-Abo). NUR für den eigenen, persönlichen Gebrauch. Mehrere Benutzer oder die Domain-Seite brauchen einen API-Schlüssel (Anthropic-Nutzungsbedingungen beachten).
  anthropic_api_key:
    name: Anthropic-API-Schlüssel
    description: Alternative zum Abo-Token (Abrechnung nach Verbrauch über die Claude-Konsole). Hat Vorrang, wenn beides eingetragen ist.
  model:
    name: Standard-Modell
    description: 'Modell für neue Chats, z. B. claude-sonnet-5-5. In der Oberfläche kann man es je Chat wechseln, wenn unten weitere Modelle eingetragen sind.'
  title_model:
    name: Modell für Chat-Titel
    description: Kleineres Modell für automatische Titel.
  models:
    name: Weitere wählbare Modelle (optional)
    description: 'Durch Komma getrennt, z. B. „claude-opus-5-5, claude-haiku-5-5“. Das Standard-Modell oben ist immer dabei. Leer: Opus 5.5 und Haiku 5.5 stehen zur Auswahl. „none“: keine Modellauswahl im Chat. Welche Modelle dein Abo zulässt, entscheidet Anthropic; ein nicht verfügbares Modell meldet einen Fehler.'
  web_access_default:
    name: 'Standard: Websuche'
    description: 'on (Standard) oder off. Die KI kann im Web suchen und Seiten lesen, wenn es nötig ist oder wenn man sie darum bittet. Je Benutzer überschreibbar; im Chat lässt sie sich je Nachricht abschalten. Die Suchanfragen verlassen dabei das Haus.'
  schedules_enabled:
    name: Geplante Aufgaben erlauben
    description: 'An (Standard): Menüpunkt „Geplant“, in dem die KI zu festen Zeiten Aufgaben erledigt (nur lesend, ohne Rückfragen). Aus: keine geplanten Aufgaben, bestehende ruhen. Geplante Läufe verbrauchen Kontingent deines Abos.'
  notify_long_answers:
    name: Benachrichtigung bei fertigen Antworten
    description: 'An (Standard): Dauert eine Antwort länger als etwa 45 Sekunden und niemand sieht zu (Chat gewechselt, Tab zu), bekommt die Person eine Benachrichtigung aufs Handy. Wirkt nur für Benutzer mit eingetragenem Benachrichtigungsdienst.'
  default_effort:
    name: Standard-Denktiefe
    description: low, medium oder high.
  language:
    name: Sprache
    description: 'de (Standard) für Deutsch oder en für Englisch. Gilt für die Oberfläche, die Meldungen des Add-ons und die Standardsprache der KI-Antworten (wer in einer anderen Sprache schreibt, bekommt die Antwort weiterhin in dieser Sprache). Bereits gespeicherte Chats bleiben unverändert.'
  ha_access_default:
    name: Standard-Zugriff auf Home Assistant
    description: 'Gilt für alle Benutzer ohne eigene Angabe: none, read (Standard), execute oder write. Bei read und execute sieht und steuert die KI nur Entitäten, die in Home Assistant für Assist freigegeben sind (siehe unten).'
  ha_write_confirm:
    name: Bestätigung bei Änderungen
    description: 'ask (Standard): Jede Änderung an Automationen, Skripten, Dashboards, Helfern und Einstellungen muss im Chat bestätigt werden (einmal, oder „in diesem Chat immer zulassen“). always_allow: ohne Rückfrage. Sensible Aktionen (Schlösser, Alarmanlage, Garagentor) und Nachrichten mit Dateianhang fragen immer nach.'
  ha_limit_to_exposed:
    name: Nur für Assist freigegebene Entitäten (lesen/ausführen)
    description: 'An (Standard): Benutzer mit read oder execute sehen und steuern nur Entitäten, die in Home Assistant unter Einstellungen → Sprachassistenten → Freigeben für Assist freigegeben sind. Benutzer mit write sind davon nicht betroffen.'
  ha_access_via_domain:
    name: HA-Zugriff auch über die Domain
    description: 'An (Standard): Die Rechtestufen gelten auch bei Anmeldung über die öffentliche Domain. Aus: dort hat die KI keinen Zugriff auf Home Assistant, nur im HA-Panel.'
  memory_enabled:
    name: Gedächtnis der KI
    description: 'An (Standard): Die KI merkt sich Fakten selbstständig, für den ganzen Haushalt und getrennt für jede Person. Jeder kann die Einträge im Chat unter „Gedächtnis“ ansehen, ändern und löschen. Aus: kein Gedächtnis.'
  memory_household_writers:
    name: Wer das Haushaltsgedächtnis ändern darf
    description: 'all (Standard): jeder Benutzer; ha_write: nur Benutzer mit Zugriffsstufe write (die anderen können es lesen, die KI trägt für sie nichts ein). Das persönliche Gedächtnis gehört immer der jeweiligen Person.'
  ha_scan_days:
    name: Smarthome-Überblick einlesen (alle … Tage)
    description: 'Der HA Copilot liest beim ersten Start und danach alle N Tage (Standard 7) einen Überblick über Home Assistant ein (Bereiche, Geräte, Automationen, Integrationen) und legt ihn im Haushaltsgedächtnis ab, damit die KI deine Umgebung von Anfang an kennt. 0 = nie automatisch, nur auf Knopfdruck im Gedächtnis-Dialog. Es werden nur Namen und Zuordnungen gelesen, keine Zustandswerte, Koordinaten oder Zugangsdaten. Gilt nur, wenn das Gedächtnis aktiv ist.'
  github_token:
    name: GitHub-Token
    description: 'Persönliches Zugriffstoken von GitHub (Einstellungen → Entwicklereinstellungen → Fine-grained tokens). Gib ihm nur die Repositories und Rechte, die die KI haben soll: Contents, Pull requests und Issues (je lesen und schreiben), Metadata (lesen); zum Anlegen neuer Repositories ein klassisches Token mit dem Recht „repo“. Leer: GitHub ist aus.'
  github_access_default:
    name: Standard-Zugriff auf GitHub
    description: 'Gilt für alle Benutzer ohne eigene Angabe: none (Standard), read oder write. Ohne Token in der Konfiguration hat das keine Wirkung.'
  github_write_confirm:
    name: Bestätigung bei GitHub-Änderungen
    description: 'ask (Standard): Jede Änderung (Commit, Pull Request, Issue, Kommentar …) muss im Chat bestätigt werden (einmal, oder „in diesem Chat immer zulassen“). always_allow: ohne Rückfrage. Immer nachgefragt wird bei Commits auf den Hauptzweig, Merge, neuen Repositories, Löschen, Workflow-Dateien und nach dem Lesen fremder Inhalte oder mit Dateianhang.'
  github_repos:
    name: Erlaubte Repositories (optional)
    description: 'Freigabeliste, durch Komma getrennt: „doralab/smarthome, doralab/*“. besitzer/* erlaubt alle Repositories eines Besitzers. Leer: alles, was das Token erreicht. Die KI kann auf andere Repositories dann gar nicht zugreifen.'
  files_enabled:
    name: Dateien erzeugen
    description: 'An (Standard): Die KI kann auf Wunsch Dateien erstellen (Word, Excel, PowerPoint, PDF sowie Skripte und andere Textdateien) und im Chat zum Herunterladen anbieten. Aus: nur Text und Codeblöcke.'
  files_keep_days:
    name: Erzeugte Dateien aufbewahren (Tage)
    description: 'Wie lange eine von der KI erstellte Datei zum Herunterladen verfügbar bleibt (1 bis 365, Standard 14). Danach wird sie gelöscht; der Chat bleibt. Dateien eines gelöschten Chats werden sofort entfernt.'
  restore_snapshot:
    name: Datenbank wiederherstellen
    description: 'Nur im Notfall: Name eines Snapshots, der beim nächsten Start eingespielt wird. Danach leeren.'
  export_database:
    name: Datenbank exportieren (Umzug)
    description: 'Nur für den Umzug in ein anderes Add-on (z. B. vom lokalen Add-on zum GitHub-Add-on): Beim Start wird eine Kopie aller Chats als ki_chat-export.sqlite3 in den Config-Ordner des Add-ons gelegt. Danach ausschalten und die Datei löschen.'
  claude_token_expires:
    name: Claude-Token läuft ab am
    description: Datum (JJJJ-MM-TT) für die Erinnerung in der App.
  entra_secret_expires:
    name: Entra-Schlüssel läuft ab am
    description: Datum (JJJJ-MM-TT) für die Erinnerung in der App.
network:
  8100/tcp: Domain-Zugang (Cloudflare Tunnel)
