<!doctype html>
<html lang="de" data-embed="__EMBED__" data-follow-ha="__FOLLOW__" data-logo-tile="__TILE__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>__NAME__</title>
  <link rel="icon" type="image/png" href="branding/icon">
  <link rel="apple-touch-icon" href="branding/icon">
  <link rel="manifest" href="branding/manifest.webmanifest">
  <meta name="theme-color" content="#0A1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="__NAME__">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script src="static/theme-init.js?v=__V__"></script>
  <link rel="stylesheet" href="static/theme.css?v=__V__">
  <link rel="stylesheet" href="branding/theme.css">
  <link rel="stylesheet" href="static/style.css?v=__V__">
  <link rel="stylesheet" href="branding/custom.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Chats">
      <div class="grip" aria-hidden="true"></div>
      <div class="side-head">
        <div class="brand"><img class="mark" src="branding/logo" width="32" height="32" alt=""><span class="brand-name">__NAME__</span></div>
        <nav class="side-nav" aria-label="Aktionen">
          <button class="nav-item" id="new-chat" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Neuer Chat</span><kbd class="nav-key" data-key="O" aria-hidden="true"></kbd></button>
          <button class="nav-item" id="nav-search" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z"/><path d="M16.5 16.5L21 21"/></svg><span>Suchen</span><kbd class="nav-key" data-key="F" aria-hidden="true"></kbd></button>
          <button class="nav-item" id="nav-schedules" type="button" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/><path d="M12 8v4.5l3 1.8"/></svg><span>Geplant</span><kbd class="nav-key" data-key="G" aria-hidden="true"></kbd></button>
        </nav>
      </div>
      <div class="side-scroll" id="side-scroll"></div>
      <div class="side-foot" id="side-foot">
        <button class="account" id="account" type="button" aria-haspopup="menu" aria-label="Konto und Einstellungen"><span class="avatar" id="avatar" aria-hidden="true"></span><span class="person-text"><b id="who">…</b><small>Angemeldet</small></span><svg class="icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>
      </div>
    </aside>
    <div class="scrim" id="drawer-scrim"></div>

    <main class="main">
      <div class="notices" id="notices" hidden></div>
      <div class="notices" id="ov-notices" hidden></div>
      <header class="topbar" id="topbar">
        <button class="round-btn" id="side-toggle" type="button" aria-label="Seitenleiste ein- oder ausblenden" aria-expanded="true" title="Seitenleiste ein- oder ausblenden"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM9.5 5v14"/></svg></button>
        <button class="round-btn" id="menu" type="button" aria-label="Chats anzeigen"><svg class="icon ic-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><svg class="icon ic-chats" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg></button>
        <h1 class="title" id="chat-title"></h1>
        <span class="test-badge" id="test-badge" hidden>Testmodus</span>
        <button class="round-btn" id="new-chat-top" type="button" aria-label="Neuer Chat" title="Neuer Chat"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </header>

      <section class="messages" id="messages" tabindex="-1">
        <div class="thread" id="thread"></div>
      </section>

      <section class="schedules" id="schedules" hidden tabindex="-1" aria-label="Geplante Aufgaben">
        <div class="sched-wrap" id="sched-wrap"></div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <div class="dock" id="dock" role="region" aria-live="polite" aria-label="Hinweise und Rückfragen" hidden>
          <div class="notices" id="limit-notices" hidden></div>
          <div class="dock-asks" id="dock-asks"></div>
        </div>
        <div class="composer-box">
          <div class="attach-tray" id="attach-tray" hidden></div>
          <input type="file" id="file-input" multiple hidden tabindex="-1" accept="image/*,.pdf,.docx,.xlsx,.pptx,text/*,.md,.csv,.tsv,.json,.yaml,.yml,.xml,.log,.py,.js,.ts,.sh,.ps1,.ini,.conf,.cfg,.toml,.sql,.html,.css">
          <div class="composer-main">
            <button class="attach has-tip" id="attach" type="button" aria-label="Dateien hochladen oder hinzufügen" data-tip="Dateien hochladen oder hinzufügen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg></button>
            <textarea id="input" rows="1" placeholder="Nachricht schreiben" aria-label="Nachricht" maxlength="20000"></textarea>
            <button class="send" id="send" type="submit" aria-label="Senden"></button>
          </div>
        </div>
        <div class="composer-foot">
          <button class="attach" id="menu-composer" type="button" aria-label="Chats anzeigen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg></button>
          <div class="composer-tools">
            <button class="attach tools-btn has-tip" id="tools" type="button" aria-label="Modell und Websuche" aria-haspopup="menu" aria-expanded="false" data-tip="Modell und Websuche" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><path d="M13 5v4M7 15v4"/></svg><span class="tools-name" id="tools-name"></span></button>
            <div class="seg small" id="effort" role="radiogroup" aria-label="Denkaufwand">
              <button type="button" role="radio" data-value="low">Niedrig</button>
              <button type="button" role="radio" data-value="medium">Mittel</button>
              <button type="button" role="radio" data-value="high">Hoch</button>
            </div>
          </div>
        </div>
      </form>
    </main>
  </div>

  <div class="scrim" id="sheet-scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button type="button" class="sheet-close" id="sheet-close" aria-label="Schließen"></button>
    </div>
    <p class="sheet-sub" id="sheet-sub"></p>
    <label class="sheet-label" id="sheet-label" for="sheet-input" hidden></label>
    <input class="field" id="sheet-input" type="text" maxlength="120" aria-labelledby="sheet-title">
    <textarea class="field area" id="sheet-text" rows="7" maxlength="4000" aria-labelledby="sheet-title" hidden></textarea>
    <p class="sheet-count" id="sheet-count" hidden></p>
    <div class="sheet-list" id="sheet-list" hidden></div>
    <div class="sheet-panel" id="sheet-panel" hidden></div>
    <div class="sheet-actions" id="sheet-actions">
      <button type="button" class="pill ghost" id="sheet-cancel">Abbrechen</button>
      <button type="button" class="pill primary" id="sheet-ok"></button>
    </div>
  </div>

  <div class="drop-hint" id="drop-hint" hidden><span>Dateien hier ablegen</span></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="branding/lang.js?v=__V__"></script>
  <script src="static/i18n.js?v=__V__"></script>
  <script src="static/markdown.js?v=__V__"></script>
  <script src="static/app.js?v=__V__"></script>
</body>
</html>
